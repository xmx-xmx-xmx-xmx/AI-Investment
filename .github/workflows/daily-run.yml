name: 量化投资简报

on:
  # 主链路：飞书 Bot 通过 API 触发（或 GitHub 手动 workflow_dispatch）。
  # 时段对应：morning(08:30) / midday(11:30) / closing(14:30) / evening(20:30) / sat_morning / sun_evening / notify
  # evening 设在 20:30 是为了此时场外基金当日净值已陆续更新，日涨跌幅数据更准确。
  workflow_dispatch:
    inputs:
      mode:
        description: '手动运行模式'
        required: true
        default: 'closing'
        type: choice
        options:
          - morning
          - midday
          - closing
          - evening
          - sat_morning
          - sun_evening
          - notify

  # ── #6 CI cron 兜底（2026-09-30）──
  # 主链路是「飞书定时任务 → Render bot → workflow_dispatch」，历史上有两个静默单点：
  # Render "Port scan timeout"（09-05/09-17）会让 bot 全程下线；workflow 被强杀
  # （09-22 12:00 cancelled）会让推送整条丢失。cron 在每个时段后约 10 分钟补跑，
  # 但先经 src/cron_guard 判重：该时段已有成功/在跑的 dispatch 就直接跳过，
  # 只在「Bot 没触发 / 触发了但失败」时补推。⚠️ 与 CRON_UTC 常量成对修改。
  # ⚠️ GitHub schedule 只保证"至少一次"，高负载可能延迟 15-30 分钟甚至偶发丢弃
  #    —— 它是兜底不是主链路；判重器会把滑出窗口的迟到运行直接放弃。
  schedule:
    # 🔴 工作日 cron 一律放在 bot 触发后约 45 分钟（bot 实测稳定在
    #    08:30/12:00/14:30/21:00，cron 有 ±12 分钟前置抖动，2026-09-30 双推
    #    事故教训：只隔 10 分钟时 cron 抖到 bot 前面 → 判重挡不住 → 双推）。
    #    正常路径：bot 先推 → cron 判重跳过；bot 失联：兜底晚约 45 分钟补推。
    - cron: '15 1 * * 1-5'    # 北京 09:15 morning（bot 08:30）
    - cron: '45 4 * * 1-5'    # 北京 12:45 midday（bot 12:00）
    - cron: '15 7 * * 1-5'    # 北京 15:15 closing（bot 14:30）
    - cron: '45 13 * * 1-5'   # 北京 21:45 evening（bot 21:00）
    - cron: '10 1 * * 6'      # 北京周六 09:10 sat_morning（周末无 bot）
    - cron: '10 13 * * 0'     # 北京周日 19:10 sun_evening（周末无 bot）

# cron 兜底需要只读查询本 workflow 今天的运行记录来判重
permissions:
  actions: read

concurrency:
  group: quant-daily-run
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # 🔥 2026-09-23：15 → 25 分钟。
    # 背景：15 分钟被撞破过 2 次，且都在 12:00 时段（2026-09-07 / 09-22，实测 15.3m / 15.4m），
    # 撞破即 job 被强杀 → 该时段推送整条静默丢失。实测 60 次运行：中位 6.7m、
    # 最长 15.4m；12:00 中位 5.1m、21:00 夜盘中位 9.2m（离 15m 仅剩 3.6m 余量）。
    # 本仓库是公开仓库，Actions 额度无限，抬高上限零成本。
    # ⚠️ 本项只是"止血"（让偶发慢的运行有机会自行跑完）。
    #    真正的根因修复见 src/net_guard.py：akshare/yfinance 调用统一加硬超时，
    #    单个数据源挂死不再拖垮整个 run。
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs

      # ── #6 cron 兜底判重（仅 schedule 触发时）──
      # 🔴 2026-09-30 事故修复：跳过分支原来写 `exit 0` —— 那只退出**本 step**，
      #    后面的「运行」步骤照样执行 → 判重形同虚设，当天 18:29 被延迟触发的
      #    closing cron 重复推送了一次收盘简报（14:30 Bot 已正常推过）。
      #    正确姿势：把结论写进 step output，由「运行」步骤的 if 来拦截。
      - name: cron 兜底判重（仅 schedule 触发时）
        id: guard
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MODE=$(python -m src.cron_guard infer-mode) || { echo "推断时段失败（滑出窗口或非既定时段）"; exit 1; }
          echo "cron 兜底模式: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if python -m src.cron_guard guard "$MODE"; then
            echo "▶️ 该时段无成功运行 → 兜底补跑 $MODE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "⏭️ 跳过 cron 兜底（rc=$rc）：该时段已由 Bot 正常处理 / 正在处理 / 已滑出窗口"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 运行
        # ⚠️ schedule 触发时必须等判重步放行；dispatch（Bot/手动）无条件运行
        if: github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true'
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOG_LEVEL: INFO
        run: |
          # ── 极简逻辑：dispatch/手动完全依赖飞书传参；schedule 由判重步推断 ──
          # 如果没拿到参数（比如网页点运行没选），默认跑 closing 收盘前指令
          MODE="${{ github.event.inputs.mode || 'closing' }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 复用判重步推断的时段（避免二次推断跨过窗口边界）
            MODE="${{ steps.guard.outputs.mode }}"
            echo "schedule 触发，使用判重步推断的时段: $MODE"
          fi

          echo "=========================================="
          echo "  AI 量化投资系统 (纯净飞书接管版)"
          echo "=========================================="
          echo "北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "接收到飞书指令: $MODE"
          echo ""

          # ── Step 0: 底层账本维护（风雨无阻，不论什么模式都先对账） ──
          python -m src.pending_resolver

          # ── Step 1: 指令执行（传什么模式，跑什么脚本） ──
          case "$MODE" in
            notify)
              python -m src.notify
              ;;
            *)
              python -m src.briefing "$MODE"
              ;;
          esac

      - name: 完成
        if: always()
        run: |
          echo ""
          echo "执行完成 @ $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"